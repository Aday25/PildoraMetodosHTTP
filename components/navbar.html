<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navbar</title>
  <style>
    nav {
      background-color: #0077cc;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.6rem;
    }
    nav h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .nav-links li a {
      color: rgb(156, 191, 241);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .nav-links li a:hover,
    .nav-links li a:focus {
      color: #ffd54f;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Píldora Métodos HTTP</h1>
    <ul class="nav-links">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../app-http/app.html">Descúbrelos</a></li>
      <li><a href="../test-http/test.html">Test</a></li>
      <li><a href="../practica-http/practica.html">Ejemplo práctico</a></li>
    </ul>
  </nav>
</body>
</html>
